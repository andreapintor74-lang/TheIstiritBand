<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Guarda i video live di The Istirit Band, cover band di Bruce Springsteen." />
    <title>Video | The Istirit Band</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="container nav-wrap">
                <a href="index.html" class="brand" aria-label="Home The Istirit Band">
                    <img src="assets/images/logo.jpg" alt="The Istirit Band" class="brand-mark" />
                    <span class="brand-text">
                        <strong>The Istirit</strong>
                        <small>Band</small>
                    </span>
                </a>

                <button class="nav-toggle" aria-label="Apri menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <nav class="site-nav" aria-label="Menu principale">
                    <a href="index.html">Home</a>
                    <a href="chi-siamo.html">Chi siamo</a>
                    <a href="date.html">Date</a>
                    <a href="gallery.html">Gallery</a>
                    <a href="locandine.html">Locandine</a>
                    <a href="video.html" class="is-active">Video</a>
                    <a href="contatti.html">Contatti</a>
                </nav>
            </div>
        </header>

        <main>
            <section class="section page-hero">
                <div class="container">
                    <p class="section-kicker">Video</p>
                    <h1>Momenti dal repertorio</h1>
                </div>
            </section>

            <section class="section videos">
                <div class="container">
                    <div class="video-grid">
                        <div class="video-card">
                            <div class="video-frame">
                                <iframe src="https://www.youtube.com/embed/MAI4m_a9cPA"
                                    title="Video live The Istirit Band"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowfullscreen></iframe>
                            </div>
                            <h3>The Building</h3>
                        </div>

                        <div class="video-card">
                            <div class="video-frame">
                                <iframe src="https://www.youtube.com/embed/9N1gaHGvtT0"
                                    title="Performance dal repertorio"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowfullscreen></iframe>
                            </div>
                            <h3>Bar Stazione - Live 2023</h3>
                        </div>

                        <div class="video-card">
                            <div class="video-frame">
                                <iframe src="https://www.youtube.com/embed/zmIoymbyFqo"
                                    title="Momenti live sul palco"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowfullscreen></iframe>
                            </div>
                            <h3>Live nelle vie di Nuoro</h3>
                        </div>

                        <div class="video-card">
                            <div class="video-frame">
                                <video src="assets/videos/WhatsApp Video 2026-08-29 at 01.08.03.mp4" controls
                                    preload="metadata"></video>
                            </div>
                            <h3>Backstage live</h3>
                        </div>

                        <div class="video-card">
                            <div class="video-frame">
                                <video src="assets/videos/WhatsApp Video 2026-08-29 at 01.09.44.mp4" controls
                                    preload="metadata"></video>
                            </div>
                            <h3>Live in sala prove</h3>
                        </div>

                        <div class="video-card">
                            <div class="video-frame">
                                <video src="assets/videos/WhatsApp Video 2026-08-29 at 01.09.50.mp4" controls
                                    preload="metadata"></video>
                            </div>
                            <h3>Momenti dal palco</h3>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="container footer-wrap">
                <p>© <span id="year"></span> The Istirit Band</p>
                <a href="#top">Torna su</a>
            </div>
        </footer>
    </div>

    <audio id="siteAudio" src="assets/audio/thunder_road_ovodda.mpeg" preload="auto" loop></audio>
    <button id="audioToggle" class="audio-toggle" type="button" aria-label="Attiva/disattiva musica di sottofondo">
        <span class="audio-toggle-icon">♪</span>
    </button>

    <script src="script.js"></script>
</body>

</html>
